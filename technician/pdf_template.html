<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Equipment Return Report</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            font-size: 10pt; 
            color: #333;
            line-height: 1.5;
            margin-top: 0; 
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px; 
            border-bottom: 3px solid #003366; 
            padding-bottom: 10px; 
            padding-top: 0; 
        }

        .header img {
            margin-bottom: 3px; 
            margin-top: 15px; 
        }

        .header h1 {
            margin: 0;
            font-size: 18pt; 
            color: #003366; 
            font-weight: 700;
        }
        .header p {
            margin: 3px 0 0; 
            font-size: 10pt; 
            color: #555;
        }

        /* Data table styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px; 
        }

        th, td {
            border: 1px solid #c0c0c0; 
            padding: 7px; 
            text-align: left;
            vertical-align: top;
            font-size: 9pt; 
        }

        thead tr {
            background-color: #343a40; 
        }
        th {
            color: #ffffff; 
            font-weight: bold;
            font-size: 9pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tbody tr:nth-child(even) {
            background-color: #f7f7f7; 
        }
        
        /* Item Details */
        .item-details strong {
            display: block;
            margin-bottom: 3px;
            color: #003366;
            font-size: 9.5pt;
        }
    </style>
</head>
<body>
    
    <div class="header">
        <img src="{{logo_path}}" alt="UniKL Logo" width="200">
        <h1>EQUIPMENT RETURN REPORT</h1>
        <p>Report for the period: <strong>{{start_date}}</strong> to <strong>{{end_date}}</strong></p>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 1%;">No</th>            
                <th style="width: 15%;">Borrower's Name</th>      
                <th style="width: 25%;">Asset Code & Item Type</th>  
                <th style="width: 10%;">Asset Issuance Date</th>    
                <th style="width: 10%;">Asset Return Date</th>    
                <th style="width: 8%;">Loan Duration</th>        
                <th style="width: 10%;">Return Condition</th>
                <th style="width: 17%;">Responsible Officer</th> 
                </tr>
        </thead>
        <tbody>
            {{table_rows}}
        </tbody>
    </table>

</body>
</html>
